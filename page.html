<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | 404 Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }
        .btn-hover {
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        .btn-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-hover:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="absolute inset-0 z-0">
        <!-- Background GIF -->
        <img src="pag.gif" alt="background" class="w-full h-full object-cover">
        <!-- Much darker overlay to improve text readability -->
        <div class="absolute inset-0 bg-black bg-opacity-70"></div>
    </div>
    <div class="max-w-4xl w-full mx-auto text-center relative z-10">
        <div class="floating mb-8">
            <svg class="w-48 h-48 mx-auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>
        
        <h1 class="text-6xl md:text-8xl font-bold text-indigo-400 mb-4">404</h1>
        <h2 class="text-2xl md:text-4xl font-semibold text-white mb-6">Oops! Page Not Found</h2>
        
        <p class="text-gray-200 mb-8 text-lg max-w-lg mx-auto">
            The page you're looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        
        <div class="flex justify-center gap-4 flex-wrap mb-12">
            <button onclick="window.history.back()" class="btn-hover bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-lg transition-all duration-300 flex items-center">
                <i class="fas fa-arrow-left mr-2"></i> Go Back
            </button>
        </div>
    </div>

    <script>
        // Add floating animation to elements randomly
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.floating');
            elements.forEach((el, index) => {
                el.style.animationDelay = `${index * 0.3}s`;
            });
            
        });
    </script>
</body>
</html>
